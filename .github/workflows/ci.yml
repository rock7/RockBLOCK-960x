name: ci

# Build and test on every push and pull request. Nothing is published.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run still going for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c:
    name: C build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release build. As an environment variable, CMake only uses it for
    # single-configuration builds (Linux, macOS); Visual Studio takes the
    # --config / -C options below instead, without an "unused" warning.
    env:
      CMAKE_BUILD_TYPE: Release
    strategy:
      fail-fast: false
      matrix:
        # windows-latest builds with Visual Studio (MSVC).
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    name: Python bindings (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported version and a current one. The library is
        # loaded with ctypes, so it doesn't depend on the Python version.
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # Builds the shared library with CMake (scikit-build-core) and installs
      # it inside the package.
      - name: Install
        run: python -m pip install ./python

      # Run from outside the checkout, so the installed package (and the
      # library inside it) is what gets imported.
      - name: Smoke test
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import rockblock960x as rb
          from rockblock960x import _native

          print("Library:", _native._find_library())
          print("MO_MAX", rb.MO_MAX, "MT_MAX", rb.MT_MAX, "SBDIX_TIMEOUT_MS", rb.SBDIX_TIMEOUT_MS)
          assert rb.MO_MAX == 340 and rb.MT_MAX == 270
          text = rb.mo_status_text(rb.MoStatus.TRAFFIC_MANAGEMENT)
          print("MO status 38:", text)
          assert text.startswith("Try later")
          with rb.RockBlock960x():
              pass
          print("OK")
